<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pariksha — run real exams you host yourself</title>
    <meta name="description" content="Pariksha is an open-source, self-hosted exam platform: question pools, 12 question types, browser proctoring, CSV results. Status: alpha, October 2026." />
    <!-- og:url, og:image(+dimensions/alt) and twitter:image(+alt) need the
         build-time origin (OQ-1 / SEO-6) and are injected by
         scripts/prerender.mjs; everything else here needs no origin, so it
         is static — and stays correct on a path that never runs the
         prerender (vite dev, a bare `vite build`, a source tarball). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pariksha" />
    <meta property="og:title" content="Pariksha — run real exams you host yourself" />
    <meta property="og:description" content="Pariksha is an open-source, self-hosted exam platform: question pools, 12 question types, browser proctoring, CSV results. Status: alpha, October 2026." />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pariksha — run real exams you host yourself" />
    <meta name="twitter:description" content="Pariksha is an open-source, self-hosted exam platform: question pools, 12 question types, browser proctoring, CSV results. Status: alpha, October 2026." />
    <!-- SEO-14: root-relative, no origin needed, so these are static too.
         favicon.ico, apple-touch-icon.png and icon-512.png are generated by
         apps/web/scripts/generate-icons.mjs from the DESIGN.md palette. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- SEO-3/P3: no client script pulls base.css in via JS any more
         (SEO-2 removed it), so it is linked here directly rather than by
         adding it to landing.css's own @import chain — apps/web/test/
         contrast-usage.test.ts resolves "the landing bundle" by walking
         landing.css's imports specifically, and its SURFACE map does not
         (yet) cover base.css's handful of selectors (body, a, .skip-link).
         base.css already @imports tokens.css and fonts.css, so these two
         links are the whole design system; Vite bundles same-entry CSS
         into one output file, so dist/ still ships exactly one stylesheet
         request (confirmed by apps/web/test/prerender.test.ts's T3). -->
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/landing.css" />
  </head>
  <body>
    <!-- SEO-1/SEO-2: scripts/prerender.mjs fills this at build time with
         react-dom/server's static markup. No client script ships on this
         page — see the design contract §5, SEO-2. -->
    <div id="root"></div>
  </body>
</html>
