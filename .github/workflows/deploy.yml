# The only deploy workflow, and it publishes one Worker: the static site and
# the API ship together, because they are one Worker (see the header of
# deploy/cloudflare/wrangler.toml for why they have to be).
#
# Automatic on merge, deliberately — `wrangler deploy` publishes code and
# nothing else. Schema changes are not in this path: `setup.mjs` applies
# migrations and a human runs it, so a merge can never rewrite a production
# table. Making the whole deploy manual to protect the database would make
# the half that has no database manual too, for no gain.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test and deploy the site and API to Cloudflare
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable DEPLOY_WEB to "true" (Settings >
    # Secrets and variables > Actions > Variables) once the Cloudflare
    # credentials are in place. Until then this job is skipped, so merging to
    # main never produces a failing run for a deployment nobody asked for.
    # The variable keeps its name now that the Worker also serves the API:
    # renaming it would silently disable the deploy on an instance that had
    # already set it.
    if: github.repository == 'SriSatyaLokesh/pariksha' && vars.DEPLOY_WEB == 'true'
    # The same Postgres the CI workflow runs. `packages/db`'s migration suite
    # refuses to skip its Postgres cases when CI is set — a deliberate guard,
    # because a dual-dialect promise that silently stops being tested is worse
    # than no promise. Without this service the gate below does not fail
    # open, it fails closed: every deploy stops on a database that was never
    # started. The two workflows have to agree about what a passing suite is.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pariksha
          POSTGRES_DB: pariksha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # Before setup-node, not after: `cache: pnpm` resolves the store by
      # running `pnpm store path`, so pnpm has to be on PATH already. The
      # version is pinned by `packageManager` in the root package.json, so
      # corepack needs no argument.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # The site's correctness guarantees — the Content-Security-Policy, the
      # contrast ratios, the no-hex-literal rule, the candidate/admin bundle
      # split — are all tests. CI runs on this same event but as a separate
      # workflow, so without this step a red CI run would not stop a deploy.
      - name: Test
        run: pnpm test
        env:
          TEST_POSTGRES_URL: postgres://postgres:pariksha@localhost:5432/pariksha_test

      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::DEPLOY_WEB is set, but CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not. Add them under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      # Publishes `apps/web/dist` as assets and `apps/api/src/index.ts` as the
      # script, in one upload. No migration step: see the header.
      - name: Deploy
        run: pnpm deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
