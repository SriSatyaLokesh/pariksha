name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test and deploy to Cloudflare
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable DEPLOY_WEB to "true" (Settings >
    # Secrets and variables > Actions > Variables) once the Cloudflare
    # credentials are in place. Until then this job is skipped, so merging to
    # main never produces a failing run for a deployment nobody asked for.
    if: github.repository == 'SriSatyaLokesh/pariksha' && vars.DEPLOY_WEB == 'true'
    # The same Postgres the CI workflow runs. `packages/db`'s migration suite
    # refuses to skip its Postgres cases when CI is set — a deliberate guard,
    # because a dual-dialect promise that silently stops being tested is worse
    # than no promise. Without this service the gate below does not fail
    # open, it fails closed: every deploy stops on a database that was never
    # started. The two workflows have to agree about what a passing suite is.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pariksha
          POSTGRES_DB: pariksha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # The site's correctness guarantees — the Content-Security-Policy, the
      # contrast ratios, the no-hex-literal rule, the candidate/admin bundle
      # split — are all tests. CI runs on this same event but as a separate
      # workflow, so without this step a red CI run would not stop a deploy.
      - name: Test
        run: pnpm test
        env:
          TEST_POSTGRES_URL: postgres://postgres:pariksha@localhost:5432/pariksha_test

      - name: Check Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::DEPLOY_WEB is set, but CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not. Add them under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Deploy
        run: pnpm --filter @pariksha/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
