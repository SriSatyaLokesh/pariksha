name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schemas:
    name: Validate schemas and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate question banks
        run: >
          npx -y -p ajv-cli@5.0.0 -p ajv-formats@2.1.1 ajv validate --spec=draft2020 --strict=false -c ajv-formats
          -s schemas/bank-1.json -r schemas/question-1.json
          -d "examples/*/questions.json"

      - name: Validate tests
        run: >
          npx -y -p ajv-cli@5.0.0 -p ajv-formats@2.1.1 ajv validate --spec=draft2020 --strict=false -c ajv-formats
          -s schemas/test-1.json
          -d "examples/*/test.json"

  # The three jobs below have no `needs:` between them, deliberately: none
  # consumes anything another produces, so they all start at t=0 and the
  # critical path is the longest of them rather than their sum. Nothing is
  # advisory — every check still runs on every pull request.
  checks:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before setup-node, not after: `cache: pnpm` resolves the store by
      # running `pnpm store path`, so pnpm has to be on PATH already. The
      # version is pinned by `packageManager` in the root package.json, so
      # corepack needs no argument.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      # scripts/prerender.mjs throws rather than bake in a placeholder origin
      # (design contract SEO-6, OQ-1), so the caller supplies SITE_URL. A CI
      # build is a check whose dist/ is thrown away, so the repository
      # variable is used once the owner sets it and the tests' own
      # non-serving origin stands in until then. The deploy workflow passes
      # vars.SITE_URL with no fallback, because that build is served.
      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://pariksha.example' }}

      # Both of these need the build above and neither needs a Cloudflare
      # account, which is the point: the deploy configuration is checked on
      # every pull request, including one from a fork, instead of first being
      # exercised by the deploy that uses it.
      - name: Wrangler dry run
        run: >
          pnpm --filter @pariksha/api exec wrangler deploy --dry-run
          --outdir /tmp/worker -c ../../deploy/cloudflare/wrangler.toml

      # Runs setup.mjs twice against an in-memory Cloudflare and asserts the
      # second run creates nothing and migrates nothing.
      - name: Setup script is idempotent
        run: node deploy/cloudflare/setup.mjs --dry-run

  test:
    name: Test suite
    runs-on: ubuntu-latest
    # The schema has to migrate cleanly onto both dialects on every pull
    # request, or SQLite and Postgres drift until a Postgres user reports it
    # months later. packages/db's Postgres cases skip when this is absent, so
    # a contributor without a database still gets a green local suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pariksha
          POSTGRES_DB: pariksha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build step: turbo's `test` task declares `dependsOn: ["^build"]`,
      # so the packages apps/api imports by name are built here anyway.
      - name: Test
        run: pnpm test
        env:
          TEST_POSTGRES_URL: postgres://postgres:pariksha@localhost:5432/pariksha_test

      # Enforces the coverage the Phase 1 review measured by hand on
      # packages/core/src, so the figure stays true without someone
      # remembering to re-check it. Each threshold is the measured value
      # rounded down (97.38 statements / 93.34 branches / 100 functions /
      # 98.52 lines), so the gate is honest rather than aspirational: it
      # fails on a real drop in covered code, not on rounding.
      - name: Coverage (packages/core)
        run: >
          pnpm --filter @pariksha/core exec vitest run
          --coverage.enabled --coverage.provider=v8
          --coverage.include="src/**" --coverage.reporter=text
          --coverage.thresholds.statements=97
          --coverage.thresholds.branches=93
          --coverage.thresholds.functions=100
          --coverage.thresholds.lines=98

  # Its own job, no `needs:`. It used to be a step in the build job, where it
  # silently depended on that job's earlier `pnpm build`: the two webServer
  # commands in apps/web/playwright.config.ts build apps/api and apps/web, but
  # not the workspace packages those two import by name, which resolve to a
  # dist/ that has to already exist. Splitting the job broke it, so the `e2e`
  # script now builds @pariksha/api and its dependencies itself and the suite
  # stands alone — one command from a clean checkout, here and locally.
  #
  # As a job it starts at t=0 instead of behind lint and type-check, and the
  # only duplicated work is checkout plus a cache-warm install. It needs no
  # SITE_URL — playwright.config.ts supplies one to the preview build, the
  # only consumer.
  #
  # Chromium alone. The suite walks one flow against a Node API and an
  # OpenID provider that both live on localhost; nothing in it is
  # engine-sensitive, and it is not cross-browser coverage.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `playwright install` skips the download when the browser is already
      # in this directory, so the step below needs no conditional. The apt
      # libraries `--with-deps` installs are not cacheable and still run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @pariksha/web exec playwright install --with-deps chromium

      # `pnpm test` deliberately does not reach this — e2e has its own
      # script so the unit suite stays fast (apps/web/vite.config.ts excludes
      # e2e/ from Vitest).
      - name: End-to-end (first run)
        run: pnpm --filter @pariksha/web e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
