name: Bug report
description: Something does not work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues must not be filed here** — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a test with …
        2. Open the candidate link in …
        3. …
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Cloudflare (reference)
        - Docker + SQLite
        - Docker + Postgres
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any candidate personal data first.
