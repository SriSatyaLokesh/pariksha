# Pariksha Lightweight Docker Compose (SQLite + Local Disk + Caddy)
# Ultra-lean single-node deployment (<100MB RAM, zero external database services).
# Run with: docker compose -f docker-compose.sqlite.yml up -d

services:
  pariksha:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: /app/data/pariksha.db
      SESSION_SECRET: ${SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      APP_URL: ${PUBLIC_URL}
      STATIC_DIR: /app/apps/web/dist
      STORAGE_DIR: /app/data/storage
      # Email (console mode for local)
      EMAIL_CONSOLE: "true"
    volumes:
      - pariksha_data:/app/data
    networks:
      - pariksha-net
    ports:
      - "8787:8787"
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pariksha:
        condition: service_healthy
    networks:
      - pariksha-net

networks:
  pariksha-net:
    driver: bridge

volumes:
  pariksha_data:
  caddy_data:
  caddy_config:
