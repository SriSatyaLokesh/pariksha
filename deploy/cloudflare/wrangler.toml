# One Worker serves the whole product: the built web app as static assets and
# the Hono API as the script. Not two Workers, because `workers.dev` is on the
# Public Suffix List — `pariksha-web.workers.dev` and `pariksha-api.workers.dev`
# would be different *sites*, and the `SameSite=Lax` session cookie
# (`apps/api/src/middleware/authenticate.ts`) is not sent on a cross-site
# fetch. Split in two, the organiser app signs in and then gets 401 on every
# authenticated request, while every test we have still passes. One origin
# makes the cookie work with no CORS, no `SameSite=None`, and it is the same
# topology Phase 11 plans for Docker.
#
# Asset requests are free and unmetered when they never invoke the script.
# `/assets/*` and `/fonts/*` — every byte a page pulls after the first — are
# excluded from `run_worker_first` below and stay free, so folding the API in
# still costs nothing for them against the 100,000 requests/day limit. What
# does cost is spelled out on `run_worker_first` itself.
#
# The name stays `pariksha-web` even though it now serves both halves: the
# repository variable `SITE_URL` is baked into prerendered canonicals and SEO
# metadata at build time, and renaming the Worker changes its URL and
# invalidates all of it. Rename when a real domain arrives, not before.

name = "pariksha-web"
main = "../../apps/api/src/index.ts"
# Cannot run ahead of the workerd binary bundled with
# `@cloudflare/vitest-plugin`: a date that one does not know fails every
# Miniflare test with "newest date supported by this server binary" while
# deploying perfectly, which is the worst of both. Raise the two together.
compatibility_date = "2026-10-18"
# `@pariksha/db` and `hono` reach node:crypto and node:buffer.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../../apps/web/dist"
# The entry point needs to hand unmatched non-API paths back to the asset
# router; see the comment in `apps/api/src/index.ts`.
binding = "ASSETS"
# Unmatched non-API paths get `dist/404.html`, which is what the e2e suite
# asserts ("the static host serves a 404 page rather than a SPA fallback").
# Without this they would fall through to the Worker and get the API's JSON
# error envelope instead of a page.
not_found_handling = "404-page"
# The API has no files under `dist/`, so without this every `/api/*` request
# would be answered by the asset router's 404 before the script ran. With it
# the script runs first, and the entry point defers back to `ASSETS` for
# everything it does not own — so an unknown API path returns Hono's JSON
# error envelope rather than the 404 page.
#
# Phase 5 Task 2 (#54): `/t/*` for T-02's public short link —
# `GET /t/:code` has no file under `dist/` either, and without this entry the
# asset router's own 404 would answer every short link before Hono ever saw
# it, the same failure `/api/*`'s own comment describes.
#
# `/*/*` is the candidate URL `/<workspace-slug>/<test-slug>`, which has no
# file behind it either and is served by the entry point as a rewrite onto
# the exam shell. `_redirects` cannot do this job — its rules were tried,
# measured on the deployed Worker and withdrawn in fb42d41 — so the Worker
# has to see the request.
#
# WHAT THIS COSTS, which the two comments above used to warn about: `*` is a
# deep match, so `/*/*` is every path of two segments or more. Those requests
# are metered now — candidate URLs, and misses like `/a/b/c` — against the
# free plan's 100,000 requests/day. What stays free is everything one segment
# deep, which is the whole marketing site (`/`, `/admin`, `/robots.txt`,
# `/sitemap.xml`, `/llms.txt`, `/favicon.ico`, `/favicon.svg`,
# `/apple-touch-icon.png`, `/icon-512.png`, `/og.png`), plus the two
# exclusions below. That is why this is `/*/*` and not the `/*` of
# Cloudflare's own SPA-shell example: a landing-page view costs nothing, and
# only a candidate sitting a test is metered.
#
# The exclusions are every two-segment path that DOES have a file behind it:
# `dist/assets/` (hashed bundles and CSS) and `dist/fonts/`. Negative
# patterns win over positive ones regardless of order, so these never reach
# the script and never meter. The entry point's own `CANDIDATE_URL` rejects
# them a second time on the dot in every asset filename, because a routing
# rule that silently stops being honoured is exactly how Phase 6 broke
# production.
run_worker_first = ["/api/*", "/t/*", "/*/*", "!/assets/*", "!/fonts/*"]

[[d1_databases]]
binding = "DB"
database_name = "pariksha"
# Written by setup.mjs. A named placeholder rather than an empty string, so a
# deploy that skipped setup fails saying which script to run.
database_id = "8aa03031-885b-40bf-a03e-2471c419f3ee"

[[r2_buckets]]
binding = "FILES"
bucket_name = "pariksha-files"

# Declared now, handled in Phase 8: the nightly retention job. Declaring the
# schedule here makes turning it on a code change that a pull request
# reviews, rather than an edit to production configuration that nobody sees.
# Until `apps/api/src/index.ts` exports `scheduled`, the nightly invocation
# has no handler — it costs no quota, but it will show in the dashboard. If
# that noise is unwelcome before Phase 8, comment this block out; nothing
# reads it.
# Phase 8d Task 4 (K22): the webhook drain, beside the nightly entry it
# shares this block with. `webhookDrainJob` (`apps/api/src/webhooks/drain.ts`)
# retries whatever `webhook_delivery` holds with exponential backoff out to
# 24 hours — free-plan Workers have neither Queues nor Durable Object
# alarms, so a table drained by its own cron is what stands in for both.
# `*/5 * * * *` is every 5 minutes: 288 invocations a day of a handler that
# finds nothing and exits on every tick but the rare one with a delivery
# actually due. Measured, and meant to show up in the free-tier dashboard
# `P8.14` builds, not to be invisible there.
[triggers]
crons = ["17 3 * * *", "*/5 * * * *"]

# No `[vars]` block: everything this Worker reads is a secret, and anything
# under `[vars]` is plaintext here and in the dashboard. See
# `.dev.vars.example` for the names and README.md for how to set them.
